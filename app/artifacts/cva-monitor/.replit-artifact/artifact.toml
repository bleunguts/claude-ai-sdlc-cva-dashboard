kind = "web"
previewPath = "/"
title = "CVA Monitor"
description = "A dense, single-page counterparty CVA monitor with client-side filters and sortable exposure data."
version = "1.0.0"
id = "artifacts/cva-monitor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21416

[services.development]
run = "pnpm --filter @workspace/cva-monitor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cva-monitor", "run", "build" ]
serve = "static"
publicDir = "artifacts/cva-monitor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21416"
BASE_PATH = "/"
